<div class="driver-header">Driver Queue</div>
<div class="rows-viewport">
  <div class="rows-spacer" [style.height.px]="topSpacerHeight"></div>
  <div class="driver-row" [class.hold]="row.hold" *ngFor="let row of visibleRows" [style.height.px]="rowHeight">
    <div>
      <div class="name">{{ row.name }}</div>
      <div class="meta">{{ row.meta }}</div>
    </div>
  </div>
  <div class="rows-spacer" [style.height.px]="bottomSpacerHeight"></div>
</div>
