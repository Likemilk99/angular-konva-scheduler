<div class="toolbar">
  <h2>Airport Driver Scheduler (Konva Demo)</h2>
  <div class="toolbar__actions">
    <div class="zoom-controls">
      <button type="button" (click)="zoomOut.emit()" [disabled]="isZoomOutDisabled">-</button>
      <span>{{ zoomLevel }}m</span>
      <button type="button" (click)="zoomIn.emit()" [disabled]="isZoomInDisabled">+</button>
    </div>
    <button type="button" (click)="reload.emit()">Reload Mock Data</button>
    <button type="button" (click)="toggleUpdates.emit()">
      {{ updatesPaused ? 'Resume Updates' : 'Pause Updates' }}
    </button>
  </div>
</div>
