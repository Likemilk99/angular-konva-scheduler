<div class="toolbar">
  <h2>Airport Driver Scheduler (Konva Demo)</h2>
  <div class="toolbar__actions">
    <button type="button" (click)="reload.emit()">Reload Mock Data</button>
    <button type="button" (click)="toggleUpdates.emit()">
      {{ updatesPaused ? 'Resume Updates' : 'Pause Updates' }}
    </button>
  </div>
</div>
