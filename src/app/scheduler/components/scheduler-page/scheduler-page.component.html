<div class="scheduler-page" *ngIf="vm$ | async as vm">
  <app-scheduler-toolbar
    [updatesPaused]="vm.updatesPaused"
    [timeZone]="vm.settings.timeZone"
    (reload)="reload()"
    (toggleUpdates)="toggleUpdates()"
    (openSettings)="openSettings()"
  ></app-scheduler-toolbar>

  <div class="loading" *ngIf="vm.loading">Loading mocked schedule...</div>

  <div #boardScroll class="board-scroll" *ngIf="!vm.loading" (scroll)="onScroll()">
    <app-drivers-panel
      [drivers]="vm.drivers"
      [rowHeight]="rowHeight"
      [visibleStartIndex]="visibleRowRange.startIndex"
      [visibleEndIndex]="visibleRowRange.endIndex"
    ></app-drivers-panel>

    <div #timelineScroll class="timeline-scroll" (scroll)="onScroll()">
      <app-timeline-canvas
        [drivers]="vm.drivers"
        [shifts]="vm.shifts"
        [events]="vm.events"
        [timelineWindow]="vm.timelineWindow"
        [zoomLevel]="vm.settings.zoomLevel"
        [timeZone]="vm.settings.timeZone"
        [rowHeight]="rowHeight"
        [viewport]="viewport"
        [visibleRowRange]="visibleRowRange"
        (eventDragged)="handleEventDragged($event)"
      ></app-timeline-canvas>
    </div>
  </div>

  <app-settings-modal
    *ngIf="settingsOpen"
    [settings]="vm.settings"
    (close)="closeSettings()"
    (save)="applySettings($event)"
  ></app-settings-modal>
</div>
